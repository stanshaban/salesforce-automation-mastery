name: Report a learning-content issue
description: Report an unclear question, incorrect explanation or broken learning step.
title: "[Content] "
body:
  - type: input
    id: item
    attributes:
      label: Question, lesson or assignment ID
      placeholder: J-L01 or the question ID shown in the portal
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What needs correction?
      description: Include the relevant version and expected behavior. Do not attach credentials or real customer data.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Supporting official source, if available
      placeholder: https://developer.salesforce.com/...
