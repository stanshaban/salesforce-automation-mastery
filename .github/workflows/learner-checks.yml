name: Learner structure checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read checker from the base commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-11-09
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .sam-checker
          persist-credentials: false
      - name: Read proposed files as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: .sam-submission
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified 2026-11-09
        with:
          node-version: '22'
      - name: Inspect project and evidence structure
        run: node .sam-checker/scripts/check-submission.mjs --root "$GITHUB_WORKSPACE/.sam-submission"
      - name: Explain the scope of this check
        if: always()
        run: |
          echo "### Learner structure checks" >> "$GITHUB_STEP_SUMMARY"
          echo "This job inspects files only. It does not authenticate to Salesforce, deploy metadata, run Apex, certify security, or approve an assignment. See the student's evidence and instructor review." >> "$GITHUB_STEP_SUMMARY"
