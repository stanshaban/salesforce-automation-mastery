name: Portal tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out portal
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-11-09
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified 2026-11-09
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Test portal and quiz engine
        run: npm test
      - name: Validate public learning content
        run: npm run check
